[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "aether-automation-engine"
version = "28.0.0"
description = "AETHER-QM: Quantum Meta Automation Engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dominik Mikszuta", email = "dominik.mikszuta@outlook.com" }]
dependencies = ["fpdf2>=2.7.0", "Pillow>=10.0.0"]
[project.scripts]
vanguard = "aether.vanguard:main"
aether = "aether.cli:main"
[tool.setuptools.packages.find]
include = ["aether*"]
