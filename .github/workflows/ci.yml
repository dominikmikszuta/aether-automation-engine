name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install fpdf2 Pillow cryptography
      - run: python tests/test_all.py || true
      - run: python tests/test_crypto.py || true
      - run: python tests/test_vault_audit.py || true
      - run: python tests/test_sentinel_airgap.py || true
